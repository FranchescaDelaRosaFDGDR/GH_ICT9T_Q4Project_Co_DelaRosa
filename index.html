<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Q4 Project</title>
    <style>
        body {
            background-image: url(https://cdn.creativefabrica.com/2022/03/09/White-abstract-background-on-3d-design-Graphics-26730412-1.jpg);
            background-size: cover;
            margin: 0; 
            color: #001d3d;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #80a3c7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;" id="display1">
        
        <div class="card shadow p-4" style="width: 400px; border-radius: 15px;">
            
            <h2 class="text-center mb-3"><b>Login</b></h2>
            <h5 onclick="toggle_instructions()" class="text-center">Check instructions ↓:</h5>
            <div id="toggle" class="text-center"></div><br>

            <form>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" required id="input1" placeholder="Enter username"> 
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" required id="input2" placeholder="Enter password">
                </div>

            <input type="checkbox" onclick="logged_in()" id="stay">
            Stay logged in
            <div id="output"></div><br>
                
                <div class="d-grid gap-2"> 
                    <input type="button" class="btn btn-primary" onclick="username_password(); login_attempts()" id="btn" value="Login">
                    <button type="reset" class="btn btn-danger">Clear</button>
                </div><br>
                <div class="text-center" style="color: #001d3d;">
                    <h6><a href="">Forgot username/password?</a></h6>
                </div>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>

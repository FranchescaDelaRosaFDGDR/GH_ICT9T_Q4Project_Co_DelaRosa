<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Q4 Project</title>
      <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            background-image: url(https://cdn.creativefabrica.com/2022/03/09/White-abstract-background-on-3d-design-Graphics-26730412-1.jpg);
            background-size: cover;
            color: #001d3d;
        }

        .main-content {
            flex: 1;
            display: flex;
        }

        #sidebar {
            width: 250px;
            min-height: 100vh;
            background: #0d1b2a;
            color: white;
            padding: 20px;
        }

        #sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 5px;
        }

        #sidebar a:hover {
            background: #1b263b;
        }

        .card {
            background-color: #0d1b2a;
        }

        .pfp {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0d1b2a;
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: rgb(152, 152, 152);
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #80a3c7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        footer {
            background-color: #0d1b2a;
            color: white;
            text-align: center;
            padding: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="main-content">

    <div id="sidebar">
        <h4 class="mb-4">Menu</h4>
        <a href="dashboard.html" class="navbar-brand">
            <img src="ICT logo.png" alt="Logo" height="90">
        </a>
        <a href="dashboard.html">Dashboard</a>
        <a href="notebooks.html">Notebooks</a>
        <a href="tasks.html">Tasks</a>
        <a href="profile.html">Profile</a>
        <a href="index.html">Logout</a>
    </div>

     <div class="container-fluid p-4">
            <h3 class="mb-4">Profile</h3>

            <div class="row g-4">
                <div class="card p-4 mx-auto" style="max-width:600px">

                    <img id="preview" class="pfp"
                        src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                        alt="Profile Picture">

                    <input type="file" class="form-control mb-3"
                        onchange="previewimage(event)"><br>

                    <h4 class="text-center mb-3" style="color: white;">
                        Student Information
                    </h4>

                    <form style="color: white;">
                        <div class="mb-3">
                            <label>Student ID</label>
                            <h6>SN671234</h6>
                        </div>

                        <div class="mb-3">
                            <label>Contact Number</label>
                            <h6>+631011676778</h6>
                        </div>

                        <div class="mb-3">
                            <label>Email Address</label>
                            <h6>cruz.ml@obmontessori.edu.ph</h6>
                        </div>

                        <div class="mb-3">
                            <label>Gender</label>
                            <h6>Female</h6>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
<footer>
